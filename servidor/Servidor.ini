; Configuração do servidor REST (camada de negócio/dados).
[Servidor]
PortaHttp=9000

[BancoDados]
; Ajuste Usuario/Senha para o seu PostgreSQL.
Servidor=localhost
Porta=5432
Banco=teste_tecnico
Usuario=postgres
Senha=postgres
; Caminho da libpq.dll. Vazio = procurar no PATH / pasta do executável.
